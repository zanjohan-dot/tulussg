  <body>
    <main class="card-page" aria-labelledby="card-title">
      <article class="identity-card" aria-label="Digital name card for Juliana Johan">
        <header class="card-top">
          <a
            class="brand-logo"
            href="https://www.tulussg.com/"
            target="_blank"
            rel="noopener"
            aria-label="Visit the TulusSG website"
          >
            <img class="brand-logo-full" src="assets/full-logo.png" alt="TulusSG" />
          </a>

          <div class="utility-actions" aria-label="Card actions">
            <button
              class="top-icon-button"
              type="button"
              data-save-contact
              aria-label="Save Juliana Johan contact"
            >
              <i class="bi bi-download" aria-hidden="true"></i>
            </button>

            <button
              class="top-icon-button"
              type="button"
              data-copy-link
              aria-label="Copy digital card link"
            >
              <i class="bi bi-copy" aria-hidden="true"></i>
            </button>
          </div>
        </header>

        <section class="profile-block">
          <div class="profile-photo-ring">
            <img class="profile-photo" src="assets/juliana-profile.jpg" alt="Juliana Johan" />
          </div>

          <h1 id="card-title">Juliana Johan</h1>

          <p class="role">
            <span>Director, Strategic Partnerships</span>
            <span>Employer & Domestic Worker Relations</span>
          </p>

          <p class="tagline">
            Supporting dignified, trusted relationships between employers and domestic workers.
          </p>
        </section>

        <section class="qr-section" aria-label="Digital card QR code">
          <button
            class="qr-button"
            type="button"
            data-open-qr
            aria-label="Open enlarged QR code"
          >
            <img
              class="qr-image"
              src="assets/card-qr.png"
              alt="QR code for Juliana Johan digital card"
            />
          </button>

          <a class="card-url" href="https://www.tulussg.com/jules/" data-card-url>
            tulussg.com/jules
          </a>
        </section>

        <nav class="contact-row" aria-label="Contact links">
          <a
            class="social-button"
            href="https://wa.me/6587875794"
            target="_blank"
            rel="noopener"
            aria-label="Open WhatsApp"
            data-whatsapp-link
          >
            <i class="bi bi-whatsapp" aria-hidden="true"></i>
          </a>

          <a
            class="social-button"
            href="mailto:jules@tulussg.com"
            aria-label="Email Juliana Johan"
            data-email-link
          >
            <i class="bi bi-envelope" aria-hidden="true"></i>
          </a>

          <div class="social-item">
            <a
              class="social-button"
              href="https://www.linkedin.com/in/julesjohan"
              target="_blank"
              rel="noopener"
              aria-label="Open Juliana's personal LinkedIn profile"
              data-personal-linkedin-link
            >
              <i class="bi bi-linkedin" aria-hidden="true"></i>
            </a>
            <span class="social-caption">Juliana</span>
          </div>

          <a
            class="social-button"
            href="https://www.linkedin.com/showcase/tulussg/"
            target="_blank"
            rel="noopener"
            aria-label="Open TulusSG LinkedIn page"
            data-linkedin-link
          >
            <i class="bi bi-linkedin" aria-hidden="true"></i>
          </a>

          <button
            class="social-button"
            type="button"
            data-open-instagram
            aria-label="Open TulusSG Instagram QR code"
          >
            <i class="bi bi-instagram" aria-hidden="true"></i>
          </button>

          <a
            class="social-button"
            href="https://www.facebook.com/people/Tulussg/61592233402554/"
            target="_blank"
            rel="noopener"
            aria-label="Open TulusSG Facebook"
            data-facebook-link
          >
            <i class="bi bi-facebook" aria-hidden="true"></i>
          </a>
        </nav>

        <a class="site-link" href="https://www.tulussg.com/" target="_blank" rel="noopener" data-website-link>
          tulussg.com
        </a>
      </article>
    </main>

    <dialog class="modal" data-qr-modal aria-labelledby="qr-modal-title">
      <div class="modal-card">
        <header class="modal-top">
          <h2 id="qr-modal-title">Digital card</h2>
          <button class="modal-close" type="button" data-close-qr aria-label="Close QR code">
            <i class="bi bi-x-lg" aria-hidden="true"></i>
          </button>
        </header>

        <div class="modal-qr">
          <img
            class="modal-qr-image"
            src="assets/card-qr.png"
            alt="Large QR code for Juliana Johan digital card"
          />
        </div>

        <a class="modal-url" href="https://www.tulussg.com/jules/" data-modal-card-url>
          tulussg.com/jules
        </a>

        <button class="modal-copy" type="button" data-modal-copy-link>
          Copy link
        </button>
      </div>
    </dialog>

    <dialog class="modal" data-instagram-modal aria-labelledby="instagram-modal-title">
      <div class="modal-card">
        <header class="modal-top">
          <h2 id="instagram-modal-title">Instagram</h2>
          <button
            class="modal-close"
            type="button"
            data-close-instagram
            aria-label="Close Instagram QR code"
          >
            <i class="bi bi-x-lg" aria-hidden="true"></i>
          </button>
        </header>

        <img
          class="instagram-qr"
          src="assets/instagram-qr.png"
          alt="Instagram QR code for TulusSG"
        />

        <a class="modal-url" href="https://www.instagram.com/tulussg" target="_blank" rel="noopener" data-instagram-link>
          instagram.com/tulussg
        </a>

        <button class="modal-copy" type="button" data-copy-instagram>
          Copy Instagram link
        </button>
      </div>
    </dialog>

    <p class="toast" role="status" aria-live="polite" data-toast hidden></p>
