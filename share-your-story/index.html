<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--
  Old address → permanent new address. GitHub Pages cannot send a server-side 301, so this stub redirects
  instantly (JavaScript, with meta refresh as a fallback) and marks the new page as canonical. It is noindex so
  there is no duplicate crawlable content. Link-preview tags are kept so shared links still preview properly.
  Replace with a real 301 if tulussg.com moves behind Cloudflare or another host with redirect rules.
-->
<title>Share Your Story | TulusSG</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://www.tulussg.com/campaigns/share-your-story/">
<meta http-equiv="refresh" content="0; url=/campaigns/share-your-story/">
<script>location.replace('/campaigns/share-your-story/' + location.search + location.hash);</script>
<meta property="og:type" content="website">
<meta property="og:site_name" content="TulusSG">
<meta property="og:title" content="Share Your Story | TulusSG">
<meta property="og:description" content="We're looking for 4 domestic helpers in Singapore to share their stories. Not a perfect story. Just your story.">
<meta property="og:url" content="https://www.tulussg.com/campaigns/share-your-story/">
<meta property="og:image" content="https://www.tulussg.com/campaigns/share-your-story/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A smiling woman sitting by Marina Bay in Singapore">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://www.tulussg.com/campaigns/share-your-story/og-image.jpg">
<link rel="icon" href="/assets/share/favicon-64.png" type="image/png">
</head>
<body style="font-family:system-ui,sans-serif;background:#FDF6EC;color:#2C2015;padding:24px">
<p><a href="/campaigns/share-your-story/" style="color:#9A4820">Share Your Story →</a></p>
</body>
</html>
